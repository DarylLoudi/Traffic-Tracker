<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arus - Live map</title>
  <meta name="description" content="Live congestion read from public city traffic cameras across Indonesia.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#16191c">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/vendor/fonts/overpass-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/live.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="live">
  <a class="skip" href="#wall" data-i18n="skip">Skip to camera wall</a>

  <header class="top">
    <a class="sign" href="/" aria-label="Arus, home">
      <span class="sign-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2 4 10.5h5.2V22h5.6V10.5H20z" fill="currentColor"/></svg>
      </span>
      <span class="sign-word">Arus</span>
    </a>
    <div class="scan" id="scan" role="status">
      <span class="scan-dot" aria-hidden="true"></span>
      <span class="scan-text" id="scan-text">Connecting</span>
      <span class="scan-bar" aria-hidden="true"><span id="scan-fill"></span></span>
    </div>
    <div class="top-tools">
      <button class="tool search-trigger" id="search-btn" type="button" aria-label="Search roads, junctions and cities">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4 4-1.4 1.4-4-4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" fill="currentColor"/></svg>
        <span class="search-word">Search</span>
        <kbd aria-hidden="true">/</kbd>
      </button>
      <button class="tool" id="about-btn" type="button" data-i18n="how">How it works</button>
      <button class="tool tool-sq" id="lang-btn" type="button" aria-label="Bahasa Indonesia">ID</button>
      </div>
  </header>

  <main>
    <section class="stage" aria-label="Map, cities and worst spots">
      <div class="map-wrap">
        <div id="map" class="map" role="region" aria-label="Map of cameras"></div>
        <div class="map-legend glass" id="legend"></div>
      </div>

      <aside class="worst glass" aria-labelledby="worst-h">
        <div class="worst-head">
          <h2 id="worst-h" data-i18n="worstTitle">Worst right now</h2>
          <p class="worst-sub" id="worst-sub"></p>
        </div>
        <ol class="worst-list" id="worst"></ol>
      </aside>

      <div class="cards-wrap">
        <div class="cards" id="cards" role="group" aria-label="City"></div>
        <button class="cards-nav prev" id="cards-prev" type="button" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="cards-nav next" id="cards-next" type="button" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </section>

    <section class="wall" id="wall" aria-labelledby="wall-h" tabindex="-1">
      <div class="wall-head">
        <h2 id="wall-h">Every camera</h2>
        <div class="wall-tools">
          <div class="chips" id="chips" role="group" aria-label="Filter by level"></div>
          <label class="search">
            <span class="sr-only" data-i18n="search">Search cameras</span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4 4-1.4 1.4-4-4A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z" fill="currentColor"/></svg>
            <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Filter by road or junction" data-i18n-ph="filterPh">
          </label>
          <label class="sort">
            <span class="sr-only" data-i18n="sortBy">Sort by</span>
            <select id="sort">
              <option value="idx" data-i18n="sortIdx">Most congested</option>
              <option value="veh" data-i18n="sortVeh">Most vehicles</option>
              <option value="name" data-i18n="sortName">Name</option>
            </select>
          </label>
        </div>
      </div>
      <p class="wall-count" id="wall-count" aria-live="polite"></p>
      <ul class="tiles" id="tiles"></ul>
    </section>
  </main>

  <footer class="foot">
    <a class="sign sign-sm" href="/" aria-label="Arus, home">
      <span class="sign-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2 4 10.5h5.2V22h5.6V10.5H20z" fill="currentColor"/></svg></span>
      <span class="sign-word">Arus</span>
    </a>
    <nav class="foot-nav" aria-label="Footer">
      <a href="/" data-i18n="footHome">Home</a>
      <a href="/live" data-i18n="footLive">Live map</a>
      <a href="/#how" data-i18n="footHow">How it works</a>
    </nav>
    <p class="foot-c">© 2026 Arus</p>
  </footer>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="d-name" tabindex="-1" id="drawer-panel"></article>
  </div>

  <dialog class="about" id="about" aria-labelledby="about-h"></dialog>

  <div class="tip" id="tip" role="tooltip" hidden></div>
</body>
</html>
